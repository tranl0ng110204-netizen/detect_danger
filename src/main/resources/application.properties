spring.application.name=detectdanger

# Cấu hình Datasource PostgreSQL - dùng biến môi trường (có fallback cho local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/detect_danger}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Cổng server
server.port=${PORT:${SERVER_PORT:7000}}
server.address=0.0.0.0


# Cấu hình JWT
jwt.secret=${JWT_SECRET:detect-danger-secret-key-detect-danger-secret-key-256bit}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Cấu hình Multipart Upload (Quét file PDF)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
